server {
    listen 80;
    client_max_body_size 20m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Админка и документация API: закрыты паролем
    location /admin/ {
        auth_basic "Закрытый доступ";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://api:8000;
    }

    location ~ ^/api/(docs|schema)/ {
        auth_basic "Закрытый доступ";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://api:8000;
    }

    # API: без пароля (у него своя авторизация по токену в заголовке Authorization)
    location /api/ {
        proxy_pass http://api:8000;
    }

    # Статика админки и Swagger (отдаёт Django через WhiteNoise)
    location /static/ {
        proxy_pass http://api:8000;
    }

    # Сайт: открыт без пароля
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
